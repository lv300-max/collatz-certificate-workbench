name: Lean math rebuild

on:
  push:
    branches:
      - lean-math-rebuild-2026-10-03

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean_math_rebuild
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean 4.29.1
        shell: bash
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.29.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean version
        run: |
          lean --version
          lake --version
      - name: Update dependencies
        run: lake update
      - name: Get mathlib cache
        run: lake exe cache get
      - name: Build all rebuilt Lean files
        run: lake build CollatzRebuild.All
      - name: Axiom audit
        run: lake env lean CollatzRebuild/Audit.lean
